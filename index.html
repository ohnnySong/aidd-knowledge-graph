<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIDD 知识图谱 · 投研版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a2332; --sub:#5b6675; --line:#e3e7ee;
    --accent:#2563eb; --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --green-bg:#ecfdf3; --amber-bg:#fffaeb; --red-bg:#fef2f2;
    --col:152px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header .ver{font-size:12px;color:var(--sub);white-space:nowrap}
  #search{flex:1;min-width:200px;max-width:420px;padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:14px;outline:none}
  #search:focus{border-color:var(--accent)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);align-items:center}
  .legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red)}
  nav{display:flex;gap:4px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;align-items:center}
  nav button{border:none;background:none;padding:7px 16px;font-size:13.5px;border-radius:8px;cursor:pointer;color:var(--sub)}
  nav button.on{background:var(--accent);color:#fff;font-weight:600}
  nav .navhint{margin-left:auto;font-size:11.5px;color:#98a2b3}
  main{flex:1;overflow:auto;min-height:0}
  header,nav,#chainbar{flex-shrink:0}

  /* ---- chain bar ---- */
  #chainbar{display:none;padding:9px 20px;background:#f8fbff;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;gap:8px;flex-wrap:wrap}
  #chainbar.on{display:flex}
  .chain-seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .chain-lbl{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.03em;white-space:nowrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:#2c3646;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.up{background:var(--amber-bg);border-color:#f5d9a8}
  .chip.down{background:var(--green-bg);border-color:#b9ecc9}
  .chip.cur{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .chip.cur:hover{color:#fff}
  .arrow{color:#b6c0cd;font-size:11px;white-space:nowrap}
  #clearchain{margin-left:auto;border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;text-decoration:underline;font-family:inherit;white-space:nowrap}

  /* ---- swimlanes ---- */
  #lanes{display:flex;gap:14px;padding:18px 20px;align-items:flex-start;min-width:max-content;position:relative}
  #wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
  .lane{width:308px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;z-index:1;transition:opacity .18s}
  .lane.hot{border-top:4px solid var(--accent)}
  .lane.faded{opacity:.55}
  .lane h2{font-size:15px;margin-bottom:2px}
  .lane .task{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
  .group{margin-bottom:12px}
  .group h3{font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:600}
  .node{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fbfcfe;transition:all .12s;position:relative}
  .node:hover{border-color:var(--accent);box-shadow:0 1px 4px rgba(37,99,235,.15)}
  .node.sel{border-color:var(--accent);background:#eff4ff;box-shadow:0 0 0 2px rgba(37,99,235,.28)}
  .node.up{border-color:#e9c07a;background:#fffdf6}
  .node.down{border-color:#8ad7a6;background:#f6fdf8}
  .node.dim{opacity:.2;filter:grayscale(.5)}
  .node .nm{font-size:13px;font-weight:600;line-height:1.35}
  .node .sub{font-size:11px;color:var(--sub);line-height:1.3}
  .flowtag{margin-left:auto;flex-shrink:0;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:6px;font-weight:700;letter-spacing:.02em}
  .flowtag.up{background:#fdf0d5;color:#946200;border:1px solid #e9c07a}
  .flowtag.down{background:#e6f8ec;color:#0f7a37;border:1px solid #8ad7a6}
  .tl-node .flowtag{margin-left:auto;align-self:flex-start}

  /* ---- drawer ---- */
  #drawer{position:fixed;top:0;right:-480px;width:460px;max-width:92vw;height:100vh;background:var(--panel);box-shadow:-4px 0 24px rgba(0,0,0,.12);transition:right .25s ease;z-index:50;display:flex;flex-direction:column}
  #drawer.open{right:0}
  #drawer .dhead{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #drawer h2{font-size:18px;line-height:1.4}
  #drawer .dsub{font-size:12.5px;color:var(--sub);margin-top:4px}
  #close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1}
  #drawer .dbody{padding:16px 20px;overflow:auto;flex:1}
  .badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600;margin:2px 0 12px}
  .badge.g{background:var(--green-bg);color:var(--green)}
  .badge.a{background:var(--amber-bg);color:var(--amber)}
  .badge.r{background:var(--red-bg);color:var(--red)}
  .field{margin-bottom:14px}
  .field h4{font-size:12px;color:var(--accent);margin-bottom:4px;letter-spacing:.05em}
  .field p{font-size:13.5px;line-height:1.75;color:#2c3646}
  .field.formula{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
  .field.formula h4{margin-bottom:6px}
  .sharebox{display:flex;gap:8px;align-items:center;margin-top:2px}
  .sharebox button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--sub);font-family:inherit}
  .sharebox button:hover{border-color:var(--accent);color:var(--accent)}
  .sharebox code{font-size:11px;color:#98a2b3}

  /* ---- tables ---- */
  .tablewrap{padding:24px;max-width:1100px}
  table{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;line-height:1.6}
  th{background:#f1f5fb;font-weight:600}
  /* ---- formula list ---- */
  #formulaview{padding:24px;max-width:900px}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .fcard h3{font-size:14px;margin-bottom:8px}
  .fcard .used{font-size:12px;color:var(--sub);margin-top:8px}
  .empty{padding:60px;text-align:center;color:var(--sub)}

  /* ---- timeline ---- */
  #timeline{padding:16px 20px 40px;width:max-content}
  .tl-grid{display:grid;grid-template-columns:repeat(15,var(--col));gap:8px}
  #timeline.fit{width:auto}
  #timeline.fit .tl-grid{grid-template-columns:repeat(15,minmax(0,1fr));gap:5px}
  #timeline.fit .tl-node{padding:4px 5px;gap:4px;align-items:center}
  #timeline.fit .tl-node .tn{font-size:10px;-webkit-line-clamp:2;line-height:1.25}
  #timeline.fit .tl-node .dot{margin-top:0;width:6px;height:6px}
  #timeline.fit .era{padding:5px 6px;font-size:10px}
  #timeline.fit .era small{font-size:9px}
  #timeline.fit .ms{font-size:9.5px;padding-left:5px;border-left-width:2px}
  #timeline.fit .ms b{font-size:10px}
  #timeline.fit .flowtag{display:none}
  .tl-tools{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .tl-tools .chain-lbl{margin:0}
  #tlzoom{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;font-size:11.5px;cursor:pointer;color:#2c3646;font-family:inherit}
  #tlzoom:hover{border-color:var(--accent);color:var(--accent)}
  .tl-sticky{position:sticky;top:0;z-index:6;background:var(--bg);padding:4px 0 8px}
  .tl-year{font-size:12px;font-weight:700;color:var(--sub);text-align:center;padding:5px 0;border-left:1px solid var(--line)}
  .tl-year:first-child{border-left:none}
  .era{border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .era small{display:block;font-size:10.5px;font-weight:500;opacity:.8;margin-top:1px}
  .era.e1{background:#eef2ff;color:#4338ca}
  .era.e2{background:#ecfeff;color:#0e7490}
  .era.e3{background:#f0fdf4;color:#15803d}
  .era.e4{background:#fef2f2;color:#b91c1c}
  .ms{border-left:2px solid #c7d2fe;padding:1px 0 1px 8px;font-size:10.5px;line-height:1.45;color:var(--sub);margin-bottom:6px}
  .ms b{display:block;font-size:11.5px;color:#3730a3;font-weight:700;margin-bottom:1px}
  .msrow{margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .band{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px}
  .band.hot{border-left:4px solid var(--accent)}
  .band-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;padding-left:2px}
  .band-head .bn{font-size:13.5px;font-weight:700}
  .band-head .be{font-size:11.5px;color:var(--sub)}
  .tl-node{border:1px solid var(--line);background:#fbfcfe;border-radius:8px;padding:6px 8px;cursor:pointer;transition:all .12s;display:flex;gap:6px;align-items:flex-start;overflow:hidden}
  .tl-node:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(37,99,235,.18);transform:translateY(-1px)}
  .tl-node .dot{margin-top:4px;width:8px;height:8px}
  .tl-node .tn{font-size:11.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tl-node.up{border-color:#e9c07a;background:#fffdf6}
  .tl-node.down{border-color:#8ad7a6;background:#f6fdf8}
  .tl-node.sel{border-color:var(--accent);background:#eff4ff;box-shadow:0 0 0 2px rgba(37,99,235,.25)}
  .tl-node.dim{opacity:.22;filter:grayscale(.5)}
  .tl-note{font-size:11.5px;color:var(--sub);margin:-6px 0 14px 2px}
  @media (max-width:760px){ #drawer{width:100vw} }
</style>
</head>
<body>
<header>
  <h1>AIDD 知识图谱</h1>
  <span class="ver">投研版 · 数据截至 2026.11 · 56 个模型节点</span>
  <input id="search" placeholder="搜索模型 / 公司 / 关键词，如 AlphaFold、Recursion、亲和力…">
  <div class="legend">
    <span><i class="dot g"></i>学术验证</span>
    <span><i class="dot a"></i>工业落地</span>
    <span><i class="dot r"></i>有分子进临床</span>
  </div>
</header>
<nav>
  <button class="on" data-view="graph">图谱</button>
  <button data-view="timeline">时间轴</button>
  <button data-view="companies">公司速查</button>
  <button data-view="formulas">公式总览</button>
  <span class="navhint">点击节点查看上下游链路 · 地址栏可直接分享定位</span>
</nav>
<div id="chainbar"></div>
<main id="main"></main>
<aside id="drawer">
  <div class="dhead">
    <div><h2 id="dTitle"></h2><div class="dsub" id="dSub"></div></div>
    <button id="close">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>
<script>
/* ============ 数据：与 aidd_knowledge_graph_draft.md 内容一致 ============ */
const FORMULAS = {
  F1:{t:'注意力机制', tex:'\\mathrm{Attention}(Q,K,V) = \\mathrm{softmax}\\left(\\frac{QK^{\\top}}{\\sqrt{d_k}}\\right)V', used:'AlphaFold / 各类 Transformer 主干'},
  F2:{t:'GNN 消息传递', tex:'h_v^{(k+1)} = \\mathrm{UPDATE}\\left(h_v^{(k)},\\ \\mathrm{AGGREGATE}\\left(\\{h_u^{(k)} : u \\in \\mathcal{N}(v)\\}\\right)\\right)', used:'Chemprop / 分子性质预测 / DTI'},
  F3:{t:'扩散模型前向加噪', tex:'q(x_t \\mid x_{t-1}) = \\mathcal{N}\\left(\\sqrt{1-\\beta_t}\\, x_{t-1},\\ \\beta_t \\mathbf{I}\\right)', used:'AlphaFold3 / RFdiffusion / DiffSBDD'},
  F4:{t:'扩散模型去噪目标（简化得分匹配）', tex:'\\mathcal{L} = \\mathbb{E}_{t, x_0, \\epsilon}\\left[\\ \\lVert \\epsilon - \\epsilon_\\theta\\left(\\sqrt{\\bar\\alpha_t}\\,x_0 + \\sqrt{1-\\bar\\alpha_t}\\,\\epsilon,\\ t\\right) \\rVert^2\\ \\right]', used:'AlphaFold3 / RFdiffusion / DiffSBDD'},
  F5:{t:'VAE 证据下界（ELBO）', tex:'\\mathcal{L}_{\\mathrm{ELBO}} = \\mathbb{E}_{q_\\phi(z\\mid x)}[\\log p_\\theta(x \\mid z)] - D_{\\mathrm{KL}}\\left(q_\\phi(z \\mid x)\\,\\Vert\\,p(z)\\right)', used:'早期分子生成 / 潜空间优化'},
  F6:{t:'强化学习策略梯度', tex:'\\nabla_\\theta J(\\theta) = \\mathbb{E}_{x \\sim \\pi_\\theta}\\left[\\,R(x)\\, \\nabla_\\theta \\log \\pi_\\theta(x)\\,\\right]', used:'REINVENT 定向分子生成'},
  F7:{t:'贝叶斯优化采集函数（EI）', tex:'\\mathrm{EI}(x) = \\mathbb{E}\\left[\\max\\left(0,\\ f(x) - f(x^+)\\right)\\right]', used:'主动学习闭环 / 工艺优化'},
  F8:{t:'结合自由能与亲和力', tex:'\\Delta G_{\\mathrm{bind}} = -RT \\ln K_d', used:'对接打分 / FEP 的物理基础'},
  F9:{t:'自由能微扰 Zwanzig 公式', tex:'\\Delta G_{A \\to B} = -k_B T \\ln \\left\\langle \\exp\\left(-\\frac{U_B - U_A}{k_B T}\\right) \\right\\rangle_A', used:'FEP+ 核心'},
  F10:{t:'掩码语言模型目标', tex:'\\mathcal{L}_{\\mathrm{MLM}} = -\\sum_{i \\in \\mathcal{M}} \\log p_\\theta\\left(x_i \\mid x_{\\setminus \\mathcal{M}}\\right)', used:'ESM / Evo / 蛋白与基因组语言模型'},
  F11:{t:'知识图谱嵌入（TransE）', tex:'\\mathbf{h} + \\mathbf{r} \\approx \\mathbf{t}, \\qquad \\mathcal{L} = \\sum \\max\\left(0,\\ \\gamma + d(\\mathbf{h}+\\mathbf{r}, \\mathbf{t}) - d(\\mathbf{h}^{\\prime}+\\mathbf{r}, \\mathbf{t}^{\\prime})\\right)', used:'靶点发现 / 老药新用'}
};
const MAT = {1:{c:'g',label:'学术验证'},2:{c:'a',label:'工业落地'},3:{c:'r',label:'有分子进临床'}};
const STAGES = [
{id:1, name:'① 靶点发现与验证', en:'Target Discovery', task:'从组学 / 文献 / 表型数据里找可成药靶点', hot:false, groups:[
 {g:'范式 A · 生物医学知识图谱', nodes:[
  {n:'KG 嵌入推理（TransE / RotatE 类）', s:'', m:2, mn:'工业落地',
   u:'把基因-疾病-通路-药物建成图谱，用嵌入向量推理"基因 X 与疾病 Y 存在未被报道的关联"，产出候选靶点排序。',
   co:'BenevolentAI（经典案例：2020 年用知识图谱把巴瑞替尼定位为 COVID-19 候选，后被 RCT 证实）、英矽智能 PandaOmics 的图谱模块',
   lim:'热门靶点背后的学术论文扎堆，冷门靶点难以发觉。对 OOD 靶点的发掘能力弱。反映的只是关联，因果性弱，A 导致 B 可能实际上由第三个因子驱动。', f:['F11']}]},
 {g:'范式 B · 蛋白 / 基因语言模型', nodes:[
  {n:'ESM2 / ESMFold', s:'Meta，2022–2023', m:2, mn:'工业落地（已并入各家公司流程）',
   u:'从蛋白序列直接学功能特征：突变效应预测（零样本判断某突变是否致病）、不需要多序列对比。',
   co:'Meta 开源，被广泛使用；EvolutionaryScale（ESM3 开发方）2025 年 11 月被 CZ Biohub 收购',
   lim:'单序列信息有限，对复合物 / 动态构象无能为力。', f:['F10']},
  {n:'ESM3', s:'EvolutionaryScale，2024', m:1, mn:'学术验证偏工业落地',
   u:'多模态蛋白语言模型（序列+结构+功能联合建模），可生成全新功能蛋白（代表作为 esmGFP）。', co:'',
   lim:'生成蛋白的药物级验证案例仍少。', f:['F10']},
  {n:'Evo 2', s:'Arc Institute，2025', m:1, mn:'学术验证',
   u:'基因组语言模型，"读写 DNA"：预测突变致病性、设计基因调控元件。', co:'',
   lim:'从序列到表型的链条太长，成药决策价值待证。', f:['F10']}]},
 {g:'范式 C · 单细胞基础模型与虚拟细胞', nodes:[
  {n:'scGPT / Geneformer / scFoundation', s:'2023–2024', m:1, mn:'学术验证（2025–2026 年多篇评测指出零样本能力有限，常打不过线性基线）',
   u:'单细胞转录组基础模型：细胞类型注释、扰动响应预测、从患者组织数据找疾病相关细胞亚群，再反推靶点。', co:'',
   lim:'最近有不少第三方测评指出，虚拟细胞大模型在几个任务上不如最简单的线性回归。用模型没见过的细胞来测，效果大幅缩水。', f:['F1']},
  {n:'State', s:'Arc Institute，2025.6', m:1, mn:'学术验证，Arc 官方称是首个稳定超过线性基线的扰动预测模型',
   u:'虚拟细胞模型：给定细胞状态+扰动（药物 / 基因敲除），预测转录组变化。训练数据超 1 亿细胞扰动数据（Tahoe-100M 等）。', co:'',
   lim:'只对 RNA 层面进行扰动建模，下游蛋白质、代谢物无法建模；2026 Virtual Cell Challenge 显示跨细胞泛化仍未解决。', f:['F1']},
  {n:'X-Cell', s:'Xaira，2026', m:1, mn:'学术验证',
   u:'同类虚拟细胞模型，2560 万 CRISPRi 扰动细胞训练；重要发现：泛化瓶颈在"扰动×细胞环境组合数"。', co:'',
   lim:'公司未上市且无临床分子，技术路线值得跟踪但不能作为投资标的直接映射。', f:['F1']}]},
 {g:'范式 D · 多组学+临床数据靶点挖掘', nodes:[
  {n:'PandaOmics', s:'Insilico', m:3, mn:'有分子进临床（且已有 II 期疗效数据）',
   u:'组学+文献+临床试验数据融合，输出靶点打分。最硬证据：TNIK 靶点由其发现，产出 rentosertib，2025 年 6 月 Nature Medicine 发表 IIa 期阳性结果（60mg 组 FVC +98.4 mL vs 安慰剂组下降），是全球首个 AI 发现靶点+AI 设计分子双标签的临床疗效验证。',
   co:'Insilico Medicine（2025 年 12 月港股上市，IPO 募资 22.77 亿港元，市值约 207 亿港元）',
   lim:'只有这一个成功案例。', f:[]}]},
 {g:'范式 E · 表型组学与 GWAS+ML', nodes:[
  {n:'表型组学靶点发现', s:'Recursion OS 类', m:3, mn:'有分子进临床（REC-4881 等多个管线来自表型筛选）',

let silent = false;

function route(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [head, tail] = raw.split('/');
  let view = 'graph', node = null;
  if (head === 'timeline' || head === 'companies' || head === 'formulas') view = head;
  const idRaw = (view === 'graph' ? head : tail) || '';
  const m = idRaw.match(/^node-(\d+)$/) || idRaw.match(/^n(\d+)$/);
  if (m){ const nd = byId('n' + m[1]); if (nd){ node = nd._id; if (view !== 'timeline') view = 'graph'; } }
  return {view, node};
}

function pushHash(){
  const h = state.view === 'graph'
    ? (state.node ? '#node-' + state.node.slice(1) : '#')
    : '#' + state.view + (state.node ? '/node-' + state.node.slice(1) : '');
  if (location.hash === h) return;
  silent = true;
  history.replaceState(null, '', h);
  silent = false;
}

function applyRoute(){
  const r = route();
  state.view = r.view;
  state.node = r.node;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.view === r.view));
  document.getElementById('search').value = '';

}

/* ---------- 链路计算与高亮 ---------- */
function walk(startId, adj){
  const seen = new Set(), stack = (adj[startId] || []).slice();
  while (stack.length){
    const id = stack.pop();
    if (seen.has(id) || id === startId) continue;
    seen.add(id);
    (adj[id] || []).forEach(nx => { if (!seen.has(nx)) stack.push(nx); });
  }
  return seen;
}

function buildFocus(id){
  const up = walk(id, IN), down = walk(id, OUT);
  const set = new Set([id, ...up, ...down]);
  return {id, up, down, up1: IN[id] || [], down1: OUT[id] || [], set};
}

function markClass(id){
  if (!state.focus) return '';
  if (id === state.focus.id) return ' sel';
  if (state.focus.up.has(id)) return ' up';
  if (state.focus.down.has(id)) return ' down';
  return ' dim';
}

function paintChain(){
  const f = state.focus;
  const nodes = document.querySelectorAll('#main .node, #main .tl-node');
  nodes.forEach(el => {
    el.classList.remove('dim','up','down','sel');
    const tag = el.querySelector('.flowtag');
    if (tag) tag.remove();
    const cls = markClass(el.dataset.id).trim();
    if (cls) el.classList.add(cls);
    if (f && f.set.has(el.dataset.id) && el.dataset.id !== f.id){
      const t = document.createElement('span');
      const isUp = f.up.has(el.dataset.id);
      t.className = 'flowtag ' + (isUp ? 'up' : 'down');
      t.textContent = isUp ? '上游' : '下游';
      el.appendChild(t);
    }
  });
  document.querySelectorAll('#main .lane').forEach(lane => {
    const any = lane.querySelector('.node:not(.dim)');
    lane.classList.toggle('faded', !!(f && !any));
  });
  renderChainBar();
  drawWires();
}

function renderChainBar(){
  const f = state.focus;
  chainbar.classList.toggle('on', !!f);
  if (!f) { chainbar.innerHTML = ''; return; }
  const cur = byId(f.id);
  const ups = f.up1.map(byId).filter(Boolean);
  const downs = f.down1.map(byId).filter(Boolean);
  const chip = (nd, cls) => '<button class="chip ' + cls + '" data-go="' + nd._id + '" title="' + esc(nd.n) + '">' + esc(nd.n) + '</button>';
  const lbl = (t, d, n) => '<span class="chain-lbl" title="' + (d ? '直接相连 ' + d + ' 个，整条链路共 ' + n + ' 个' : '') + '">' + t + (d < n ? ' ' + d + ' / 全链 ' + n : ' ' + n) + '</span>';
  let h = '';
  h += lbl('上游输入', ups.length, f.up.size);
  h += '<span class="chain-seg">' + (ups.length ? ups.map(n => chip(n,'up')).join('<span class="arrow">→</span>') : '<span class="arrow">（无）</span>') + '</span>';
  h += '<span class="arrow">→</span>' + chip(cur, 'cur');
  h += '<span class="arrow">→</span>' + lbl('下游应用', downs.length, f.down.size);
  h += '<span class="chain-seg">' + (downs.length ? downs.map(n => chip(n,'down')).join('<span class="arrow">→</span>') : '<span class="arrow">（无）</span>') + '</span>';
  h += '<button id="clearchain">清除高亮</button>';
  chainbar.innerHTML = h;
  chainbar.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => openNode(b.dataset.go)));
  chainbar.querySelector('#clearchain').addEventListener('click', () => {
    state.focus = null; state.node = null;
    paintChain(); closeDrawer(); pushHash();
  });
}

function drawWires(){
  const svg = document.getElementById('wires');
  const lanes = document.getElementById('lanes');
  if (!svg || !lanes) return;
  svg.innerHTML = '';
  const f = state.focus;
  if (!f) return;
  const w = lanes.scrollWidth, hgt = lanes.scrollHeight, box = lanes.getBoundingClientRect();
  svg.setAttribute('width', w); svg.setAttribute('height', hgt);
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
  svg.innerHTML = '<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">' +
                  '<path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker></defs>';
  PAIRS.forEach(([a, b]) => {
    if (!f.set.has(a) || !f.set.has(b)) return;
    const ea = document.querySelector('.node[data-id="' + a + '"]');
    const eb = document.querySelector('.node[data-id="' + b + '"]');
    if (!ea || !eb) return;
    const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
    const ax = ra.left - box.left, ay = ra.top - box.top, bx = rb.left - box.left, by = rb.top - box.top;
    const down = by >= ay;
    const x1 = ax + ra.width / 2, y1 = down ? ay + ra.height : ay;
    const x2 = bx + rb.width / 2, y2 = down ? by : by + rb.height;
    const dy = Math.max(18, Math.abs(y2 - y1) * 0.42) * (down ? 1 : -1);
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', a === f.id ? '#16a34a' : (b === f.id ? '#d97706' : '#94a3b8'));
    p.setAttribute('stroke-width', '1.4');
    p.setAttribute('stroke-dasharray', '4 3');
    p.setAttribute('opacity', '0.65');
    p.setAttribute('marker-end', 'url(#ah)');
    svg.appendChild(p);
  });
  const note = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  note.setAttribute('x', '4'); note.setAttribute('y', hgt - 6);
  note.setAttribute('fill', '#b6c0cd'); note.setAttribute('font-size', '11');
  note.textContent = '橙色 = 上游输入 · 绿色 = 下游应用';
  svg.appendChild(note);
}

/* ---------- 抽屉 ---------- */
function openNode(id, fromRoute){
  const nd = byId(id);
  if (!nd) return;
  state.node = id;
  state.focus = buildFocus(id);
  document.getElementById('dTitle').textContent = nd.n;
  document.getElementById('dSub').textContent = (nd.s ? nd.s + ' · ' : '') + nd._stage + ' · ' + nd._group +
    (nd._y ? ' · ' + nd._y + ' 年' : '');
  const mt = MAT[nd.m];
  let h = '<span class="badge ' + mt.c + '">' + mt.label + '</span>';
  if (nd.mn) h += '<div class="field"><h4>成熟度说明</h4><p>' + nd.mn + '</p></div>';
  h += '<div class="field"><h4>用途</h4><p>' + nd.u + '</p></div>';
  if (nd.co) h += '<div class="field"><h4>代表公司</h4><p>' + nd.co + '</p></div>';
  if (nd.lim) h += '<div class="field"><h4>局限</h4><p>' + nd.lim + '</p></div>';
  if (nd.tip) h += '<div class="field"><h4>投研提示</h4><p>' + nd.tip + '</p></div>';
  if (nd.f && nd.f.length){
    nd.f.forEach(fid => {
      const fo = FORMULAS[fid];
      h += '<div class="field formula"><h4>' + fid + ' · ' + fo.t + '</h4><div class="kt" data-tex="' + fo.tex.replace(/"/g,'&quot;') + '"></div></div>';
    });
  }
  const hash = state.view === 'graph' ? '#node-' + id.slice(1) : '#' + state.view + '/node-' + id.slice(1);
  h += '<div class="field"><h4>分享定位</h4><div class="sharebox"><code>' + esc(hash) + '</code>' +
       '<button id="copylink">复制链接</button></div></div>';
  document.getElementById('dBody').innerHTML = h;
  document.getElementById('dBody').querySelector('#copylink').addEventListener('click', async (e) => {
    const url = location.origin + location.pathname + hash;
    try { await navigator.clipboard.writeText(url); e.target.textContent = '已复制'; }
    catch(_){ location.hash = hash; e.target.textContent = '已写入地址栏'; }
    setTimeout(() => { e.target.textContent = '复制链接'; }, 1600);
  });
  drawer.classList.add('open');
  renderMath(document.getElementById('dBody'));
  paintChain();
  if (!fromRoute) pushHash();
  const sel = document.querySelector('.node[data-id="' + id + '"], .tl-node[data-id="' + id + '"]');
  if (sel) sel.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
}

function closeDrawer(){
  drawer.classList.remove('open');
  state.node = null;
  state.focus = null;
  paintChain();
}

function renderMath(root){
  if (typeof katex === 'undefined'){ setTimeout(() => renderMath(root), 200); return; }
  root.querySelectorAll('.kt').forEach(el => {
    try { katex.render(el.dataset.tex, el, {displayMode:true, throwOnError:false}); } catch(e){ el.textContent = el.dataset.tex; }
  });
}

 ['Insilico Medicine（英矽智能）','港股 2025.12 上市','①②③⑤ 全链条','rentosertib IIa 阳性（Nature Medicine 2025.6），已进 III 期'],
 ['Recursion（含 Exscientia）','美股 RXRX','①②③④','REC-4881 II 期（FAP 息肉负荷降 43–53%）；Exscientia DSP-1181 史上首个 AI 设计分子进临床'],
 ['Schrödinger','美股 SDGR','②③','Nimbus TYK2（FEP+ 优化）→ 武田 zasocitinib 获 FDA 优先审评'],

 ['Generate Biomedicines','纳斯达克 2026.2 上市','③（大分子）','GB-0895 抗 TSLP III 期，全球首个 AI 设计抗体 III 期'],
 ['Absci','美股 ABSI','③（大分子）','ABS-101 进 I 期'],

];

function renderCompanies(){

  COMPANIES.forEach(r => { h += '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'; });

function renderFormulas(){
  let h = '<div id="formulaview">';
  Object.keys(FORMULAS).forEach(fid => {
    const fo = FORMULAS[fid];
    h += '<div class="fcard"><h3>' + fid + ' · ' + fo.t + '</h3><div class="kt" data-tex="' + fo.tex.replace(/"/g,'&quot;') + '"></div><div class="used">用于：' + fo.used + '</div></div>';
  });

/* ---------- 时间轴 ---------- */
const Y0 = 2012, Y1 = 2026, NCOL = Y1 - Y0 + 1;

function pack(arr, keyFn){
  const counts = {}, rowOf = new Map();
  arr.map(keyFn).forEach(k => { counts[k] = 0; });
  arr.forEach(nd => {
    const k = keyFn(nd);
    rowOf.set(nd._id, counts[k]++);
  });
  const rows = Math.max(1, ...Object.values(counts));
  return {rows, rowOf};
}
const colOf = y => Math.min(NCOL, Math.max(1, y - Y0 + 1));

function renderTimeline(){
  const years = Array.from({length: NCOL}, (_, i) => Y0 + i);
  const fit = state.fit !== false;
  let h = '<div id="timeline"' + (fit ? ' class="fit"' : '') + '>';
  h += '<div class="tl-tools"><span class="chain-lbl">2012 – 2026 · 4 个技术时代 · 11 个拐点</span>' +
       '<button id="tlzoom">' + (fit ? '放大看细节' : '缩到一屏') + '</button></div>';

  h += '<div class="tl-sticky"><div class="tl-grid">' +
       years.map(y => '<div class="tl-year">' + y + '</div>').join('') + '</div></div>';

  h += '<div class="tl-grid" style="margin-bottom:6px">' +
       ERAS.map(e => '<div class="era ' + e.cls + '" style="grid-column:' + colOf(e.from) + ' / span ' + (colOf(e.to) - colOf(e.from) + 1) + '" title="' + esc(e.s) + '">' +
                      esc(e.t) + '<small>' + e.from + '–' + e.to + '</small></div>').join('') + '</div>';

  const ms = MILESTONES.slice().sort((a, b) => a.y - b.y);
  const msPack = pack(ms, m => m.y);
  h += '<div class="msrow"><div class="chain-lbl" style="margin-bottom:8px">演进脉络</div>' +
       '<div class="tl-grid">' +
       ms.map(m => '<div class="ms" style="grid-column:' + colOf(m.y) + ';grid-row:' + (msPack.rowOf.get(m.y) + 1) + '">' +
                   '<b>' + m.y + ' · ' + esc(m.t) + '</b>' + esc(m.d) + '</div>').join('') +
       '</div></div>';

  STAGES.forEach(st => {
    const list = [];
    st.groups.forEach(gp => gp.nodes.forEach(nd => list.push(nd)));
    list.sort((a, b) => (a._y || 0) - (b._y || 0) || a.n.localeCompare(b.n));
    const pk = pack(list, nd => nd._y || 0);
    h += '<div class="band' + (st.hot ? ' hot' : '') + '">' +
         '<div class="band-head"><span class="bn">' + st.name + '</span><span class="be">' + st.en + ' · ' + list.length + ' 个节点</span></div>' +
         '<div class="tl-grid">' +
         list.map(nd => '<div class="tl-node" data-id="' + nd._id + '" style="grid-column:' + colOf(nd._y || Y0) + ';grid-row:' + (pk.rowOf.get(nd._id) + 1) + '" title="' + esc(nd.n) + (nd._y ? '（' + nd._y + '）' : '') + '">' +
                        '<i class="dot ' + MAT[nd.m].c + '"></i><span class="tn">' + nd.n + '</span></div>').join('') +
         '</div></div>';
  });

  h += '<div class="tl-note">按技术首次出现 / 代表作发表的年份定位；同一节点跨多年时取最早一年。点击节点可看详情与上下游链路。</div>';
  h += '</div>';
  main.innerHTML = h;
  main.querySelectorAll('.tl-node').forEach(el => el.addEventListener('click', () => openNode(el.dataset.id)));
  main.querySelector('#tlzoom').addEventListener('click', () => {
    state.fit = !(state.fit !== false);
    const left = document.getElementById('main').scrollLeft;
    renderTimeline();
    if (!state.fit) document.getElementById('main').scrollLeft = left;
  });
  if (state.focus) paintChain();
}

const VIEWS = {graph:renderGraph, timeline:renderTimeline, companies:renderCompanies, formulas:renderFormulas};

/* ---------- 事件绑定 ---------- */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  state.focus = null; state.node = null;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('search').value = '';
  closeDrawer();
  VIEWS[state.view]();
  main.scrollTop = 0;
  pushHash();
}));

document.getElementById('search').addEventListener('input', () => {
  if (state.view !== 'graph'){
    state.view = 'graph';
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.view === 'graph'));
  }
  renderGraph();
});
document.getElementById('close').addEventListener('click', () => { closeDrawer(); pushHash(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeDrawer(); pushHash(); }
});
window.addEventListener('resize', () => { if (state.focus) drawWires(); });
window.addEventListener('hashchange', () => { if (!silent) applyRoute(); });

applyRoute();
