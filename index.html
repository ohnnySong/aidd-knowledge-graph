<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIDD 知识图谱 · 投研版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a2332; --sub:#5b6675; --line:#e3e7ee;
    --accent:#2563eb; --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --green-bg:#ecfdf3; --amber-bg:#fffaeb; --red-bg:#fef2f2;
    --col:152px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700;white-space:nowrap}
  header .ver{font-size:12px;color:var(--sub);white-space:nowrap}
  #search{flex:1;min-width:200px;max-width:420px;padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:14px;outline:none}
  #search:focus{border-color:var(--accent)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);align-items:center}
  .legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red)}
  nav{display:flex;gap:4px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;align-items:center}
  nav button{border:none;background:none;padding:7px 16px;font-size:13.5px;border-radius:8px;cursor:pointer;color:var(--sub)}
  nav button.on{background:var(--accent);color:#fff;font-weight:600}
  nav .navhint{margin-left:auto;font-size:11.5px;color:#98a2b3}
  main{flex:1;overflow:auto;min-height:0}
  header,nav,#chainbar{flex-shrink:0}

  /* ---- chain bar ---- */
  #chainbar{display:none;padding:9px 20px;background:#f8fbff;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;gap:8px;flex-wrap:wrap}
  #chainbar.on{display:flex}
  .chain-seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .chain-lbl{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.03em;white-space:nowrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:#2c3646;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.up{background:var(--amber-bg);border-color:#f5d9a8}
  .chip.down{background:var(--green-bg);border-color:#b9ecc9}
  .chip.cur{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .chip.cur:hover{color:#fff}
  .arrow{color:#b6c0cd;font-size:11px;white-space:nowrap}
  #clearchain{margin-left:auto;border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;text-decoration:underline;font-family:inherit;white-space:nowrap}

  /* ---- swimlanes ---- */
  #lanes{display:flex;gap:14px;padding:18px 20px;align-items:flex-start;min-width:max-content;position:relative}
  #wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
  .lane{width:308px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;z-index:1;transition:opacity .18s}
  .lane.hot{border-top:4px solid var(--accent)}
  .lane.faded{opacity:.55}
  .lane h2{font-size:15px;margin-bottom:2px}
  .lane .task{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
  .group{margin-bottom:12px}
  .group h3{font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:600}
  .node{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fbfcfe;transition:all .12s;position:relative}
  .node:hover{border-color:var(--accent);box-shadow:0 1px 4px rgba(37,99,235,.15)}
  .node.sel{border-color:var(--accent);background:#eff4ff;box-shadow:0 0 0 2px rgba(37,99,235,.28)}
  .node.up{border-color:#e9c07a;background:#fffdf6}
  .node.down{border-color:#8ad7a6;background:#f6fdf8}
  .node.dim{opacity:.2;filter:grayscale(.5)}
  .node .nm{font-size:13px;font-weight:600;line-height:1.35}
  .node .sub{font-size:11px;color:var(--sub);line-height:1.3}
  .flowtag{margin-left:auto;flex-shrink:0;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:6px;font-weight:700;letter-spacing:.02em}
  .flowtag.up{background:#fdf0d5;color:#946200;border:1px solid #e9c07a}
  .flowtag.down{background:#e6f8ec;color:#0f7a37;border:1px solid #8ad7a6}
  .tl-node .flowtag{margin-left:auto;align-self:flex-start}

  /* ---- drawer ---- */
  #drawer{position:fixed;top:0;right:-480px;width:460px;max-width:92vw;height:100vh;background:var(--panel);box-shadow:-4px 0 24px rgba(0,0,0,.12);transition:right .25s ease;z-index:50;display:flex;flex-direction:column}
  #drawer.open{right:0}
  #drawer .dhead{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #drawer h2{font-size:18px;line-height:1.4}
  #drawer .dsub{font-size:12.5px;color:var(--sub);margin-top:4px}
  #close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1}
  #drawer .dbody{padding:16px 20px;overflow:auto;flex:1}
  .badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600;margin:2px 0 12px}
  .badge.g{background:var(--green-bg);color:var(--green)}
  .badge.a{background:var(--amber-bg);color:var(--amber)}
  .badge.r{background:var(--red-bg);color:var(--red)}
  .field{margin-bottom:14px}
  .field h4{font-size:12px;color:var(--accent);margin-bottom:4px;letter-spacing:.05em}
  .field p{font-size:13.5px;line-height:1.75;color:#2c3646}
  .field.formula{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
  .field.formula h4{margin-bottom:6px}
  .sharebox{display:flex;gap:8px;align-items:center;margin-top:2px}
  .sharebox button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--sub);font-family:inherit}
  .sharebox button:hover{border-color:var(--accent);color:var(--accent)}
  .sharebox code{font-size:11px;color:#98a2b3}

  /* ---- tables ---- */
  .tablewrap{padding:24px;max-width:1100px}
  table{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;line-height:1.6}
  th{background:#f1f5fb;font-weight:600}
  /* ---- formula list ---- */
  #formulaview{padding:24px;max-width:900px}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .fcard h3{font-size:14px;margin-bottom:8px}
  .fcard .used{font-size:12px;color:var(--sub);margin-top:8px}
  .empty{padding:60px;text-align:center;color:var(--sub)}

  /* ---- papers ---- */
  #papersview{max-width:860px;margin:0 auto;padding:24px 20px 60px}
  #papersview .phead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  #papersview .phead h2{font-size:20px}
  #papersview .phead .upd{font-size:12.5px;color:var(--sub)}
  .dayh{font-size:15px;font-weight:700;margin:22px 0 10px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px}
  .pcard .tzh{font-size:16px;font-weight:700;line-height:1.5}
  .pcard .ten{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
  .pcard .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:12.5px;color:var(--sub)}
  .pcard .meta .src{background:#eff4ff;color:var(--accent);padding:2px 9px;border-radius:10px;font-weight:600;font-size:11.5px}
  .pcard .meta a{color:var(--accent);text-decoration:none}
  .pcard .meta a:hover{text-decoration:underline}
  .pcard .ttag{font-size:11.5px;background:#f1f5fb;color:var(--sub);padding:2px 8px;border-radius:10px}
  .pcard .nchip{font-size:11.5px;background:#ecfdf3;color:#15803d;border:1px solid #bbf0cf;padding:2px 8px;border-radius:10px;text-decoration:none}
  .pcard .nchip:hover{background:#dcf5e6;text-decoration:none}
  .pcard .intro{display:none;font-size:13.5px;line-height:1.9;color:#2c3646;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px;white-space:pre-wrap}
  .pcard.open .intro{display:block}
  .pcard .tgl{border:none;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:4px 0}
  .pcard .tgl:hover{text-decoration:underline}


  /* ---- timeline ---- */
  #timeline{padding:16px 20px 40px;width:max-content}
  .tl-grid{display:grid;grid-template-columns:repeat(15,var(--col));gap:8px}
  #timeline.fit{width:auto}
  #timeline.fit .tl-grid{grid-template-columns:repeat(15,minmax(0,1fr));gap:5px}
  #timeline.fit .tl-node{padding:4px 5px;gap:4px;align-items:center}
  #timeline.fit .tl-node .tn{font-size:10px;-webkit-line-clamp:2;line-height:1.25}
  #timeline.fit .tl-node .dot{margin-top:0;width:6px;height:6px}
  #timeline.fit .era{padding:5px 6px;font-size:10px}
  #timeline.fit .era small{font-size:9px}
  #timeline.fit .ms{font-size:9.5px;padding-left:5px;border-left-width:2px}
  #timeline.fit .ms b{font-size:10px}
  #timeline.fit .flowtag{display:none}
  .tl-tools{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .tl-tools .chain-lbl{margin:0}
  #tlzoom{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;font-size:11.5px;cursor:pointer;color:#2c3646;font-family:inherit}
  #tlzoom:hover{border-color:var(--accent);color:var(--accent)}
  .tl-sticky{position:sticky;top:0;z-index:6;background:var(--bg);padding:4px 0 8px}
  .tl-year{font-size:12px;font-weight:700;color:var(--sub);text-align:center;padding:5px 0;border-left:1px solid var(--line)}
  .tl-year:first-child{border-left:none}
  .era{border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .era small{display:block;font-size:10.5px;font-weight:500;opacity:.8;margin-top:1px}
  .era.e1{background:#eef2ff;color:#4338ca}
  .era.e2{background:#ecfeff;color:#0e7490}
  .era.e3{background:#f0fdf4;color:#15803d}
  .era.e4{background:#fef2f2;color:#b91c1c}
  .ms{border-left:2px solid #c7d2fe;padding:1px 0 1px 8px;font-size:10.5px;line-height:1.45;color:var(--sub);margin-bottom:6px}
  .ms b{display:block;font-size:11.5px;color:#3730a3;font-weight:700;margin-bottom:1px}
  .msrow{margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .band{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px}
  .band.hot{border-left:4px solid var(--accent)}
  .band-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;padding-left:2px}
  .band-head .bn{font-size:13.5px;font-weight:700}
  .band-head .be{font-size:11.5px;color:var(--sub)}
  .tl-node{border:1px solid var(--line);background:#fbfcfe;border-radius:8px;padding:6px 8px;cursor:pointer;transition:all .12s;display:flex;gap:6px;align-items:flex-start;overflow:hidden}
  .tl-node:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(37,99,235,.18);transform:translateY(-1px)}
  .tl-node .dot{margin-top:4px;width:8px;height:8px}
  .tl-node .tn{font-size:11.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tl-node.up{border-color:#e9c07a;background:#fffdf6}
  .tl-node.down{border-color:#8ad7a6;background:#f6fdf8}
  .tl-node.sel{border-color:var(--accent);background:#eff4ff;box-shadow:0 0 0 2px rgba(37,99,235,.25)}
  .tl-node.dim{opacity:.22;filter:grayscale(.5)}
  .tl-note{font-size:11.5px;color:var(--sub);margin:-6px 0 14px 2px}
  @media (max-width:760px){ #drawer{width:100vw} }
</style>
</head>
<body>
<header>
  <h1>AIDD 知识图谱</h1>
  <span class="ver">投研版 · 数据截至 2026.11 · 56 个模型节点</span>
  <input id="search" placeholder="搜索模型 / 公司 / 关键词，如 AlphaFold、Recursion、亲和力…">
  <div class="legend">
    <span><i class="dot g"></i>学术验证</span>
    <span><i class="dot a"></i>工业落地</span>
    <span><i class="dot r"></i>有分子进临床</span>
  </div>
</header>
<nav>
  <button class="on" data-view="graph">图谱</button>
  <button data-view="timeline">时间轴</button>
  <button data-view="companies">公司速查</button>
  <button data-view="papers">每日论文</button>
  <span class="navhint">点击节点查看上下游链路 · 地址栏可直接分享定位</span>
</nav>
<div id="chainbar"></div>
<main id="main"></main>
<aside id="drawer">
  <div class="dhead">
    <div><h2 id="dTitle"></h2><div class="dsub" id="dSub"></div></div>
    <button id="close">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>
<script>
/* ============ 数据：与 aidd_knowledge_graph_draft.md 内容一致 ============ */
const FORMULAS = {
  F1:{t:'注意力机制', tex:'\\mathrm{Attention}(Q,K,V) = \\mathrm{softmax}\\left(\\frac{QK^{\\top}}{\\sqrt{d_k}}\\right)V', used:'AlphaFold / 各类 Transformer 主干'},
  F2:{t:'GNN 消息传递', tex:'h_v^{(k+1)} = \\mathrm{UPDATE}\\left(h_v^{(k)},\\ \\mathrm{AGGREGATE}\\left(\\{h_u^{(k)} : u \\in \\mathcal{N}(v)\\}\\right)\\right)', used:'Chemprop / 分子性质预测 / DTI'},
  F3:{t:'扩散模型前向加噪', tex:'q(x_t \\mid x_{t-1}) = \\mathcal{N}\\left(\\sqrt{1-\\beta_t}\\, x_{t-1},\\ \\beta_t \\mathbf{I}\\right)', used:'AlphaFold3 / RFdiffusion / DiffSBDD'},
  F4:{t:'扩散模型去噪目标（简化得分匹配）', tex:'\\mathcal{L} = \\mathbb{E}_{t, x_0, \\epsilon}\\left[\\ \\lVert \\epsilon - \\epsilon_\\theta\\left(\\sqrt{\\bar\\alpha_t}\\,x_0 + \\sqrt{1-\\bar\\alpha_t}\\,\\epsilon,\\ t\\right) \\rVert^2\\ \\right]', used:'AlphaFold3 / RFdiffusion / DiffSBDD'},
  F5:{t:'VAE 证据下界（ELBO）', tex:'\\mathcal{L}_{\\mathrm{ELBO}} = \\mathbb{E}_{q_\\phi(z\\mid x)}[\\log p_\\theta(x \\mid z)] - D_{\\mathrm{KL}}\\left(q_\\phi(z \\mid x)\\,\\Vert\\,p(z)\\right)', used:'早期分子生成 / 潜空间优化'},
  F6:{t:'强化学习策略梯度', tex:'\\nabla_\\theta J(\\theta) = \\mathbb{E}_{x \\sim \\pi_\\theta}\\left[\\,R(x)\\, \\nabla_\\theta \\log \\pi_\\theta(x)\\,\\right]', used:'REINVENT 定向分子生成'},
  F7:{t:'贝叶斯优化采集函数（EI）', tex:'\\mathrm{EI}(x) = \\mathbb{E}\\left[\\max\\left(0,\\ f(x) - f(x^+)\\right)\\right]', used:'主动学习闭环 / 工艺优化'},
  F8:{t:'结合自由能与亲和力', tex:'\\Delta G_{\\mathrm{bind}} = -RT \\ln K_d', used:'对接打分 / FEP 的物理基础'},
  F9:{t:'自由能微扰 Zwanzig 公式', tex:'\\Delta G_{A \\to B} = -k_B T \\ln \\left\\langle \\exp\\left(-\\frac{U_B - U_A}{k_B T}\\right) \\right\\rangle_A', used:'FEP+ 核心'},
  F10:{t:'掩码语言模型目标', tex:'\\mathcal{L}_{\\mathrm{MLM}} = -\\sum_{i \\in \\mathcal{M}} \\log p_\\theta\\left(x_i \\mid x_{\\setminus \\mathcal{M}}\\right)', used:'ESM / Evo / 蛋白与基因组语言模型'},
  F11:{t:'知识图谱嵌入（TransE）', tex:'\\mathbf{h} + \\mathbf{r} \\approx \\mathbf{t}, \\qquad \\mathcal{L} = \\sum \\max\\left(0,\\ \\gamma + d(\\mathbf{h}+\\mathbf{r}, \\mathbf{t}) - d(\\mathbf{h}^{\\prime}+\\mathbf{r}, \\mathbf{t}^{\\prime})\\right)', used:'靶点发现 / 老药新用'}
};
const MAT = {1:{c:'g',label:'学术验证'},2:{c:'a',label:'工业落地'},3:{c:'r',label:'有分子进临床'}};
const DETAILS = {
 "n0": {
  "principle": "把\"基因—疾病—通路—药物\"建成一张大图，给每个实体和关系学一个向量，让已知事实在向量空间里满足几何约束，再拿这些向量去猜图里还没有连的边。",
  "mechanism": "以 TransE 为代表：头实体向量加关系向量应约等于尾实体向量，$\\mathbf{h} + \\mathbf{r} \\approx \\mathbf{t}$，训练用间隔排序损失（F11）：\n\n$$\\mathcal{L} = \\sum_{(h,r,t)} \\max\\!\\left(0,\\ \\gamma + d(\\mathbf{h}+\\mathbf{r},\\ \\mathbf{t}) - d(\\mathbf{h}'+\\mathbf{r},\\ \\mathbf{t}')\\right)$$\n\nRotatE 把关系建模为复数空间里的旋转 $t = h \\circ r,\\ |r_i|=1$，能处理对称、反对称、反转、组合这四类关系模式，是后来药物重定位图谱（如 TxGNN 底层思路）的常用基座。打分高的\"缺失边\"即为候选关联。",
  "why": "生物医学知识天然是关系型的，且散布在数千万篇文献和几十个数据库里。嵌入把离散符号变成可计算的连续空间，一次训练就能对全图做排序推理，成本远低于逐个假设做湿实验。BenevolentAI 2020 年用这套方法从图谱里捞出巴瑞替尼作为 COVID-19 候选，后来被随机对照试验证实，是这个范式最有名的一次命中。",
  "co": "BenevolentAI（知识图谱起家，巴瑞替尼案例）、英矽智能 PandaOmics 的图谱模块、TxGNN（哈佛，环节⑥老药新用也用到同源思路）、开源实现 PyKEEN / DGL-KE。",
  "lim": "热门靶点背后的论文扎堆，图谱越挖越是那些人尽皆知的关联，冷门靶点信号弱。对图谱外的 OOD 靶点基本无能为力。更根本的问题是它只反映关联：A 连 B 可能是第三个因子驱动的，因果性得另找证据。",
  "papers": [
   "Bordes et al., \"Translating Embeddings for Modeling Multi-relational Data\", NeurIPS 2013",
   "Sun et al., \"RotatE: Knowledge Graph Embedding by Relational Rotation in Complex Space\", ICLR 2019",
   "Richardson et al.（BenevolentAI）, \"Baricitinib as potential treatment for 2019-nCoV acute respiratory disease\", The Lancet 2020"
  ]
 },
 "n1": {
  "principle": "把蛋白质序列当\"句子\"喂给 Transformer 做掩码语言模型预训练，逼模型为了填回被遮住的氨基酸而自学出结构与功能的统计规律。",
  "mechanism": "训练目标是掩码语言模型损失（F10）：\n\n$$\\mathcal{L}_{\\mathrm{MLM}} = -\\sum_{i \\in \\mathcal{M}} \\log p_\\theta\\!\\left(x_i \\mid x_{\\setminus \\mathcal{M}}\\right)$$\n\nESM2 最大版本 15B 参数、约 2.5 亿条序列预训练。ESMFold 在 ESM2 表征上接一个结构模块，**不需要多序列比对（MSA）**就能从单条序列直接出三维结构，速度比 AlphaFold2 快约一个数量级，曾用两周时间把 6 亿条宏基因组序列全部折叠，建成 ESM Atlas。零样本突变效应预测直接用掩码位置的对数概率差打分。",
  "why": "共进化信息本来藏在同源序列比对里，语言模型在大规模预训练后把这些共进化信号压缩进了参数，单序列就能用。对没有同源序列的\"孤儿蛋白\"和设计出来的新蛋白，这是少数能用的办法。",
  "co": "Meta 开源（权重全公开）；ESM 团队后独立为 EvolutionaryScale，2025 年 11 月被 CZ Biohub 收购。工业界已把 ESM 嵌入当作通用蛋白特征，喂给下游的活性、稳定性、可开发性预测模型，几乎是行业标准件。",
  "lim": "单序列能承载的信息毕竟有限，遇到复合物、构象变化、配体存在时的结构重排就使不上劲。预测的是静态结构，口袋开闭这类动态问题不归它管。",
  "papers": [
   "Rives et al., \"Biological structure and function emerge from scaling unsupervised learning to 250 million protein sequences\", PNAS 2021",
   "Lin et al., \"Evolutionary-scale prediction of atomic-level protein structure with a language model\", Science 2023"
  ]
 },
 "n2": {
  "principle": "把蛋白的序列、三维结构、功能注释统一编码成离散 token，用同一个掩码语言模型联合建模，从而既能\"读\"也能\"写\"蛋白。",
  "mechanism": "结构不再是连续坐标，而是被量化成离散结构 token，与序列 token、功能 token 混排在同一条序列里做掩码预测，目标函数仍是 MLM 损失（F10）的推广。生成时可以给定任意模态组合作为提示词（prompt），例如固定某个功能位点的结构 token、放开其余位置让模型补全，实现对生成过程的可控引导。最大版本 98B 参数，训练用 7710 亿 token（31.5 亿条序列、2.36 亿结构、5.39 亿功能标注）。招牌实验是生成 esmGFP：与已知荧光蛋白序列同一性仅 58%，官方称相当于模拟了 5 亿年自然进化。",
  "why": "离散 token 化把结构预测里复杂的几何架构问题降维成序列建模问题，可以直接吃 Transformer 的规模化红利；多模态联合建模让\"功能→结构→序列\"的反向设计成为可能，这是 ESM2 这类纯序列模型做不到的。",
  "co": "EvolutionaryScale（Forge API 开放，小模型开源、非商业许可；2025 年 11 月被 CZ Biohub 收购）。学术与工业界多用于蛋白功能预测与设计候选初筛。",
  "lim": "esmGFP 是个漂亮的演示，但荧光蛋白是最好做的题目之一，生成蛋白走到药物级验证的案例仍然很少。大模型权重不开源，商用要谈 API 条款，复现和审计都受限。",
  "papers": [

 },
 "n3": {
  "principle": "把全生命树的基因组 DNA 当语料训练语言模型，让模型学会基因组的\"语法\"，从而预测突变致病性、生成新的调控元件和序列。",
  "mechanism": "主干不是 Transformer 而是 StripedHyena 2（卷积+注意力混合算子），目的是把上下文窗口撑到 100 万碱基对——普通注意力的平方复杂度在这个长度下不可行。40B 参数，训练数据 9.3 万亿碱基对，覆盖细菌、古菌、真核。训练目标本质上是 DNA 序列上的下一 token 预测（F10 的自回归版本）。零样本任务包括 BRCA1 等基因的变异致病性分类、非编码突变效应预测、以及生成染色质可及性符合预期的调控序列。",

  "lim": "从\"序列有多不自然\"到\"成药决策\"之间链条太长：预测突变致病不等于告诉你该开发什么药。模型看的是序列统计，组织特异性、细胞状态这些决定基因功能的环境变量它拿不到。计算开销也大，全基因组建模不是普通实验室玩得起的。",

 "n4": {
  "principle": "把单细胞转录组里\"哪个基因表达了多少\"当作语言来预训练 Transformer，得到细胞与基因的通用表征，下游接细胞注释、扰动预测、网络推断等任务。",
  "mechanism": "三个模型思路同宗、token 化方式不同：scGPT 用基因名+表达量分箱做生成式预训练（3300 万细胞）；Geneformer 把每个细胞的基因按表达量排序成\"句子\"（rank encoding），3000 万细胞预训练；scFoundation 把表达量连续值直接映射成嵌入，约 5000 万细胞、1 亿参数。目标函数都是掩码重建（F10 的变体）。预训练完冻结主干，下游任务只需少量微调。",
  "why": "单细胞数据噪声大、批次效应重、每个数据集都很稀疏，单点训练的小模型很难迁移。大规模预训练把跨数据集共享的基因共表达结构压进参数，理论上小样本下游任务也能起点更高。从患者组织单细胞数据里找疾病相关细胞亚群、再反推该亚群的驱动基因，是这套模型在靶点发现上的标准用法。",
  "co": "三个模型全部开源（scGPT 来自多伦多大学 Bo Wang 组，Geneformer 来自 Broad，scFoundation 来自 BioMap/清华）。Xaira 的 X-Cell、Arc 的 State 都以 scGPT 或同类编码器做初始化，说明这批模型已经成了虚拟细胞的\"底座件\"。",
  "lim": "2025 年以来好几篇第三方评测泼了冷水：零样本场景下这批基础模型在细胞注释、扰动预测上经常打不过线性回归或简单基线，换一批没见过的细胞效果大幅缩水。问题主要出在数据而非架构——单细胞数据集的分布差异太大，预训练学到的\"通用性\"被高估了。",
  "papers": [

 "n5": {
  "principle": "给模型看\"一个细胞现在的状态 + 一个扰动（敲基因 / 加药）\"，让它直接预测扰动后的转录组——把虚拟细胞变成一个可查询的函数。",
  "mechanism": "两个组件：SE（State Embedding）把单个细胞的转录组压成向量，训练目标是让一个扰动实验里的多个细胞嵌入在空间里聚拢；ST（State Transition）以一组对照细胞的嵌入集合为输入、以扰动标签为条件，输出扰动后细胞集合的嵌入分布——输入输出都是\"集合\"而非单细胞，用集合到集合的 Transformer 实现。训练数据是超过 1 亿个扰动细胞（Tahoe-100M 等公开 Perturb-seq 数据集）。Arc 官方称它是首个在扰动预测上稳定超过线性基线的模型。",
  "why": "之前的模型大多在\"单细胞→单细胞\"层面做预测，被批次效应和噪声淹没。State 改在\"细胞群体→细胞群体\"层面建模，把个体差异平均掉，信号噪声比一下子上来了。对药企的用法很直接：先 in silico 筛一遍\"敲哪个基因、细胞往哪走\"，再决定做哪些湿实验。",
  "co": "Arc Institute 开源（权重+代码）；2025 年 Arc 办的 Virtual Cell Challenge 把它当基准底座。2026 年 3 月 Arc 又发了 Stack（in-context learning 版本）。被广泛用于虚拟细胞方向的对比基线。",
  "lim": "建模范围只到 RNA 层：扰动引起的蛋白水平、代谢物变化不在模型里，而很多药效恰恰发生在那些层面。2026 年 Virtual Cell Challenge 的结果显示，跨细胞类型、跨实验室的泛化仍然没解决，换种细胞就得重新掂量。",
  "papers": [

  "mechanism": "架构是在 scGPT 编码器基础上继续预训练的扩散 LM：推理时不一步步自回归生成，而是迭代地把对照表达值\"替换\"成扰动表达值，每步精修一次。关键设计是 11 层交叉注意力，查询外部先验嵌入——LLM 文本、ESM-2 蛋白嵌入、STRING 互作网络、DepMap 遗传依赖、JUMP Cell Painting 形态学、scGPT 基因嵌入（消融显示 STRING 和 ESM-2 贡献最大）。配套数据集 X-Atlas/Pisces 是目前最大的 CRISPRi Perturb-seq 资源：2560 万个扰动单细胞、16 种细胞环境。旗舰版 X-Cell-Ultra 49 亿参数，是目前最大的因果扰动模型。",

  "lim": "还是预印本，没过同行评审。训练用的 CRISPRi 都是基因敲低，药物扰动（小分子、剂量梯度）的化学空间不在里面，离\"预测候选分子的细胞效应\"还有距离。公司未上市也无临床分子，技术值得跟踪但不是可直接映射的投资标的。",
  "papers": [

 "n7": {
  "principle": "把组学数据、文献、专利、临床试验记录全部塞进一个打分引擎，按\"新颖性、可信度、可成药性、安全性、商业可行性\"等多维度给每个候选靶点算综合分，输出排序清单。",
  "mechanism": "不是单一模型而是管线：iPANDA 通路扰动分析做组学降维（把基因表达映射到信号通路活性得分），文本引擎从数千万出版物/专利/基金里抽实体和关系（图谱模块见节点 1），最后一组打分模型按预设维度加权合成靶点评分。平台方披露的数据底座：130 万疾病组学样本、4700 万出版物、550 万专利、近百万临床试验记录。",
  "why": "靶点发现的真实瓶颈不是算力而是信息整合——一个靶点的证据散在组学、文献、专利、临床数据四种异构来源里，人读不过来。PandaOmics 的最硬证据是 TNIK：平台把它列为特发性肺纤维化头号新靶点，后续 Chemistry42 设计出 rentosertib，2025 年 6 月 Nature Medicine 发表 IIa 期阳性结果（60mg 组 FVC +98.4 mL vs 安慰剂下降），是全球首个\"AI 发现靶点 + AI 设计分子\"双标签且有人体疗效数据的全链条案例。",
  "co": "Insilico Medicine（2025 年 12 月港股上市，IPO 募资 22.77 亿港元）。平台对外授权（礼来、复星等合作中均涉及），也有学术合作案例（ALS 靶点、肝癌双功能靶点 PRPF19/MAPK9 等）。",
  "lim": "说到底成功的全链条案例只有 TNIK 一个，样本量撑不起\"方法普适\"的结论。打分权重和模型组合是黑箱，外部客户没法审计某个靶点为什么排第一。底层数据全是公开来源，竞争对手理论上能搭出类似的东西，护城河在工程整合而非数据独占。",

 "n8": {
  "principle": "不给模型任何先验假设，直接把\"敲掉基因 X 的细胞长什么样\"高通量拍下来，用深度学习从形态学特征里反推基因功能和基因—疾病关系。",
  "mechanism": "底层技术是 Cell Painting：用六种荧光染料给细胞器染色，成像后提取上千维形态学特征。Recursion 的做法是把这套成像流程工业化——自动化湿实验室每周跑数百万个实验，图像过 CNN/ViT 编码成表型嵌入，再算\"敲基因 A 的表型\"与\"疾病表型\"\"已知药物表型\"在嵌入空间里的距离，距离近即提示功能关联。本质是拿表型当全细胞水平的\"读出\"，绕开\"先懂机制再找靶点\"的传统路径。",
  "why": "很多疾病的机制根本没搞清楚，基于假设的靶点发现无从下手；表型筛选是\"先看现象、后补机制\"，历史上大量重磅药物就是这么来的。AI 的贡献是把表型比较的吞吐量提升了几个数量级，并且能在高维形态空间里看出人眼看不出的相似性。Recursion 多个临床管线（如 REC-4881 治 FAP，II 期息肉负荷降 43–53%）都源于这套表型图谱。",
  "co": "Recursion（RXRX，自建 BioHive-2 超算；开源了 RxRx 系列表型数据集，JUMP-Cell Painting 联盟也是这类数据的公共版本）。Xaira 的 X-Cell 也把 JUMP 形态学嵌入当先验用，说明表型数据已是通用资产。",
  "lim": "从\"表型像\"到\"这是个可成药靶点\"之间还差着好几步验证，命中率提升不等于临床成功率提升——Recursion 2025 年 5 月砍了 3 个临床项目，就是这条链路上损耗的现实注脚。平台资本开支极重，机器人实验室加超算不是谁都抄得动，但这也意味着故事讲得再好，最后还得管线读出来说话。",
  "papers": [
   "Bray et al., \"Cell Painting, a high-content image-based assay for morphological profiling using multiplexed fluorescent dyes\", Nature Protocols 2016",
   "Fay et al.（Recursion）, \"RxRx1: A dataset for evaluating experimental batch correction methods\", NeurIPS Datasets 2020（及后续 RxRx3 系列）"
  ]
 },
 "n9": {
  "principle": "统计上有个硬结论：有人体遗传学证据（GWAS 关联、罕见病功能缺失突变）撑腰的靶点，临床成功率大约是没有的两倍——那就系统性地给每个\"基因—疾病\"对算一个遗传学证据分，按分排靶点。",
  "mechanism": "以 Open Targets 为代表：汇总 GWAS Catalog、UK Biobank、罕见病数据库（ClinVar、Orphanet）、体细胞突变、表达关联等多源证据，每类证据按统计强度和效应大小打分，再按数据源的可信度加权合成为 0–1 的关联分。各家药企和平台公司的私有版本会在上面叠自有队列数据（如 Tempus 的临床基因组库）和机器学习重打分。这里的\"AI\"含量其实不高，大头是统计遗传学和数据工程。",
  "why": "这是少数有 meta 层面大样本统计背书的策略：Nelson et al. 2015 年在 Nat Genet 上分析历史管线，发现有人类遗传证据的靶点成功率约两倍；King et al. 2019 年用 GWAS 数据复核出 2.6 倍。逻辑也直白——人体里已经\"做过实验\"（天然功能缺失突变携带者没有严重问题），安全性和有效性的先验都更好。",
  "co": "Open Targets（EMBL-EBI + 药企联盟，全公开，业界标准件）；Tempus（TEM，靠自有临床基因组数据库做差异化）；各大药企内部几乎都有同类系统。",
  "lim": "公开数据源人人都用，差异化很小，很难构成独家壁垒——真正的区分度在谁手里有独占的大型队列。另外两倍成功率听着不错，但基数低，绝对成功率仍然只有个位数百分比，它改善的是赔率，不是确定性。",
  "papers": [
   "Nelson et al., \"The support of human genetic evidence for approved drug indications\", Nature Genetics 2015",
   "King et al., \"Are drug targets with genetic support twice as likely to be approved?\", PLoS Genetics 2019",
   "Ochoa et al., \"Open Targets Platform: supporting systematic drug–target identification and prioritisation\", Nucleic Acids Research（年度更新）"
  ]
 },
 "n10": {
  "principle": "把多序列比对（MSA）里的共进化信号喂给一个专门设计的 Transformer（Evoformer），端到端直接输出蛋白三维原子坐标。",

  "principle": "把蛋白口袋的三维结构当条件，让扩散模型直接在口袋内逐步生成 3D 分子的原子坐标和类型——分子是\"长\"在口袋里的。",
  "mechanism": "以口袋原子为条件上下文，在配体的原子坐标+原子类型联合空间上定义扩散（F3），用等变图网络保证旋转平移不变性，去噪目标同 F4。DiffSBDD 还支持固定部分子结构做 inpainting（只重新生成分子的某个片段，用于骨架跃迁和侧链优化）；Pocket2Mol 用自回归几何生成替代扩散；TargetDiff 联合生成姿态并预测亲和力。",
  "why": "相比 SMILES 生成，3D 条件生成直接利用了结合口袋的几何互补性，生成分子天然带着结合姿态信息，理论上起点高于\"先生成再对接\"。学术基准上这类模型的类药性、结合能分布都明显优于 2D 生成基线。",
  "co": "学术开源为主（DiffSBDD 来自洛桑理工/微软研究院；Pocket2Mol/TargetDiff 来自清华团队）；已被多家平台公司集成进生成管线。",
  "lim": "生成和落地之间卡着两道筛子：合成可行性（3D 空间里拼得出来的分子化学家未必做得出来）和物理合法性（键长键角、空间位阻）。更要命的是湿实验命中率缺乏公开数据——benchmark 上的漂亮分布和真到实验室合成测试之间，公开证据链几乎是断的。",
  "papers": [
   "Schneuing et al., \"Structure-based drug design with equivariant diffusion models\"（DiffSBDD）, Nature Computational Science 2024",
   "Peng et al., \"Pocket2Mol: Efficient Molecular Sampling Based on 3D Protein Pockets\", ICML 2022",
   "Guan et al., \"3D Equivariant Diffusion for Target-Aware Molecule Generation and Affinity Prediction\"（TargetDiff）, ICLR 2023"
  ]
 },
 "n23": {
  "principle": "把分子编码进连续潜空间，在潜空间里插值、优化，再解码回分子——让\"搜索更好分子\"变成连续优化问题。",
  "mechanism": "变分自编码器：编码器把分子图压成潜向量 z，解码器重建分子，训练目标是证据下界（F5）：\n\n$$\\mathcal{L}_{\\mathrm{ELBO}} = \\mathbb{E}_{q_\\phi(z\\mid x)}[\\log p_\\theta(x \\mid z)] - D_{\\mathrm{KL}}\\!\\left(q_\\phi(z \\mid x)\\,\\Vert\\,p(z)\\right)$$\n\nJT-VAE 的巧思是把分子拆成化学子结构（环、官能团）的\"结树\"再编码，保证解码出的分子化学合法；MoLeR 进一步用 scaffold+motif 逐步扩展的方式生成。潜空间连续后可接贝叶斯优化沿性质梯度爬坡。",
  "why": "2018–2021 年间的主流路线，第一次让\"定向分子优化\"有了可微分的操作界面。潜空间+贝叶斯优化这套组合拳至今仍是多参数优化的常用框架。",
  "co": "学术开源（MIT、微软研究院）；多家平台的早期生成模块基于此，现多被扩散和 RL 路线取代或包围。",
  "lim": "解码有效率始终是个问题——潜空间里光滑的邻域解码出来可能是非法分子。生成多样性受潜空间结构限制，化学新颖性不足。如今基本退居二线，价值更多在\"潜空间优化框架\"而非生成器本身。",
  "papers": [
   "Jin et al., \"Junction Tree Variational Autoencoder for Molecular Graph Generation\", ICML 2018",
   "Maziarz et al., \"Learning to Extend Molecular Scaffolds with Structural Motifs\"（MoLeR）, ICLR 2022"
  ]
 },
 "n24": {
  "principle": "不手工设计分子描述符，让图神经网络直接在分子图上做消息传递，自己学出和性质相关的表征。",
  "mechanism": "有向消息传递：每条化学键是有向边，键的隐藏状态沿键方向聚合邻居信息（F2 的有向版本）：\n\n$$h_v^{(k+1)} = \\mathrm{UPDATE}\\!\\left(h_v^{(k)},\\ \\mathrm{AGGREGATE}\\!\\left(\\{h_u^{(k)} : u \\in \\mathcal{N}(v)\\}\\right)\\right)$$\n\n若干层后把原子/键表征池化成分子级向量，接前馈网络输出性质预测。支持多任务（几十个端点共享表征）、可加分子级特征（描述符、指纹拼接）。",
  "why": "手工指纹（ECFP 等）是定死的编码，和特定性质的相关性碰运气；消息传递让表征跟着预测目标学，任务适配性天然更好。开源、文档全、benchmark 覆盖广，已成学术与工业界最常用的 QSAR 基线。",
  "co": "MIT 开源（后由 ML 化学社区维护，2024 年发布 2.0）；几乎所有做性质预测的团队都拿它当过基线。",
  "lim": "有一个反直觉的事实必须记住：在 TDC ADMET 基准上，ECFP 指纹+梯度提升树这种老办法在多个任务上打平甚至超过 Chemprop 这类深度模型。深度方法的优势主要在数据量大、骨架多样的场景，小数据集上并不稳赢。评估公司宣传时这是现成的锚。",
  "papers": [
   "Yang et al., \"Analyzing Learned Molecular Representations for Property Prediction\", J. Chem. Inf. Model. 2019",
   "Heid et al., \"Chemprop: A Machine Learning Package for Chemical Property Prediction\", J. Chem. Inf. Model. 2024"
  ]
 },
 "n25": {
  "principle": "给分子预训练一个\"三维理解力\"：预训练任务不是预测性质，而是重建被噪声破坏的 3D 原子坐标，逼模型把几何规律学进参数。",
  "mechanism": "Transformer 主干，输入是原子类型+3D 坐标，自注意力里显式编码原子间距离（F1 的几何改造版）。预训练任务有两个：坐标去噪（随机扰动坐标后要求还原）和被掩码原子的表征重建。下游接性质预测、构象生成、对接打分，共用同一套预训练权重。曾获 NeurIPS 2022 分子性质预测竞赛冠军。",
  "why": "分子的性质本质上是 3D 结构决定的，2D 图表征丢掉了构象信息。Uni-Mol 把 3D 几何直接放进预训练目标，在构象敏感的任务（结合、极性表面积类性质）上起点更高。",
  "co": "深势科技 DP Technology（私企，工具平台型，按口径不展开）+ 微软研究院；开源，被集成进多家公司的性质预测管线。",
  "lim": "成也 3D、受困于 3D：输入构象质量直接决定输出质量，而真实场景里配体构象本身就要靠预测——构象给错，后面全错。柔性分子的多构象问题（同一个分子有一堆能量相近的构象）它一个构象一个构象地处理，没有集成层面的一致性保证。",
  "papers": [
   "Zhou et al., \"Uni-Mol: A Universal 3D Molecular Representation Learning Framework\", ICLR 2023"
  ]
 },
 "n26": {
  "principle": "不算绝对亲和力，算\"配体 A 变成配体 B 后结合自由能差多少\"——沿着一条炼金术路径逐步把 A 微扰成 B，对每步势能差做统计力学平均。",
  "mechanism": "Zwanzig 自由能微扰公式（F9）：\n\n$$\\Delta G_{A \\to B} = -k_B T \\ln \\left\\langle \\exp\\!\\left(-\\frac{U_B - U_A}{k_B T}\\right) \\right\\rangle_A$$\n\n实际计算把 A→B 拆成几十个中间态 λ 窗口，每个窗口跑分子动力学采样，显式水溶剂+显式蛋白柔性，串起各窗口得相对结合自由能。精度约 1 kcal/mol（亲和力 5 倍以内），是先导优化阶段\"哪个类似物值得合成\"的决策依据。",
  "why": "它回答的正是药物化学家每天的问题：在这个骨架上把甲基换成氯、活性会怎样。物理第一性原理，不依赖训练集里有没有见过这类分子，外推可靠性是 ML 方法比不了的。最硬商业案例：Nimbus 用 FEP+ 优化的 TYK2 抑制剂 zasocitinib 以 $40 亿首付卖给武田，2026 年获 FDA 优先审评——AI 制药迄今最贵的一笔交易，底座是物理方法。",
  "co": "Schrödinger（SDGR，FEP+ 为其旗舰产品）；开源替代品 OpenFE 近年成熟，正在压低这个环节的价格。",
  "lim": "算一个分子要小时级算力，通量决定了它只能用在最后几十到几百个候选的精排，大规模筛选轮不到它。精度也对体系敏感——大构象变化、共价结合、金属配位这些场景误差明显放大。ML 亲和力模型（Boltz-2 类）切的就是\"先粗筛、头部再交 FEP 复核\"的分层空档。",
  "papers": [
   "Zwanzig, \"High-temperature equation of state by a perturbation method\", J. Chem. Phys. 1954",
   "Wang et al., \"Accurate and Reliable Prediction of Relative Ligand Binding Potency in Prospective Drug Discovery (FEP+)\", JACS 2015"
  ]
 },
 "n27": {
  "principle": "FEP 的第一遍廉价替代：把 FEP 算出来的百万级亲和力标签蒸馏进神经网络，之后每个新分子 20 秒出预测值。",
  "mechanism": "架构见节点 13，这里讲用法分层：hit 分类阶段用二分类输出 affinity_probability_binary（是不是 binder），hit-to-lead 排序用连续值 affinity_pred_value，排进头部 1% 的候选再交给 FEP 或实验确认。训练前对 FEP+ 基准蛋白做了序列去重（≥90% 同一性剔除），保证基准上是\"没见过的蛋白\"。",
  "why": "蒸馏把一次性的大算力投入（FEP 批量打标）摊薄到之后每一次推理上，单位成本降了三个数量级。FEP+ 基准 Pearson 约 0.62–0.66，已经和开源 OpenFE 打平；2026 年的独立研究证明针对特定靶点微调后还能再涨（某难例从 R≈0.01 提到 0.40）。对药企而言，\"够用且极快\"的排序工具价值大于\"完美但极慢\"。",
  "co": "MIT + Recursion 共建，MIT 协议开源；Boltz PBC 托管 API（2026.6 上线 BoltzMol-1 专用筛选模型）。",
  "lim": "两个数字要一起记：官方基准 0.62–0.66，但部分独立测试集上掉得明显；精度与 MSA 深度、化学型是否在训练域强相关。PROTAC、大环、多肽这类新骨架基本出域，用之前必须查适用域。它的正确位置是\"分层漏斗的粗筛层\"，当成 FEP 平替会翻车。",
  "papers": [
   "Passaro et al., \"Boltz-2: Towards Accurate and Efficient Binding Affinity Prediction\", bioRxiv 2025"
  ]
 },
 "n28": {
  "principle": "不一次测完所有候选：每轮用代理模型预测+不确定性估计，只挑\"信息价值最高\"的少数分子送湿实验，结果回来更新模型，几轮收敛到最优。",
  "mechanism": "代理模型（常用高斯过程）给出每个候选分子的预测均值和方差，采集函数决定测谁——以期望改进（EI）为例（F7）：\n\n$$\\mathrm{EI}(x) = \\mathbb{E}\\left[\\max\\!\\left(0,\\ f(x) - f(x^+)\\right)\\right]$$\n\nEI 同时奖励\"预测好\"（exploitation）和\"不确定\"（exploration），避免模型困在局部最优。闭环速度由湿实验通量决定，算法侧早已不是瓶颈。",
  "why": "湿实验是药物研发最贵最慢的环节，采样效率直接等于钱。文献案例里约 500 个变体 4 轮迭代把酶活提升 16–26 倍；在蛋白定向进化领域这套方法十年前就被验证（2019 年 Nat Methods 的机器学习指导进化是标志性工作）。",
  "co": "晶泰科技 XtalPi（2228.HK，\"AI+机器人\"干湿闭环的港股标的；2025 年 11 月与礼来 $3.45 亿双抗合作，继 2023 年 $2.5 亿小分子后再携手）；Recursion 的自动化平台同源；学术界开源工具链成熟（BoTorch/Ax）。",
  "lim": "闭环转多快取决于湿实验通量和质量，算法不是瓶颈——这意味着纯软件公司抄不走这套东西，真正难抄的是自动化实验室和长期积累的自有数据。另外代理模型在高维化学空间的不确定性估计本身就不太可靠，探索和利用的平衡经常需要人工调。",
  "papers": [
   "Yang et al., \"Machine-learning-guided directed evolution for protein engineering\", Nature Methods 2019",
   "Shahriari et al., \"Taking the human out of the loop: A review of Bayesian optimization\", Proceedings of the IEEE 2016"
  ]
 },
 "n29": {
  "principle": "从目标分子往回拆：神经网络预测\"这一步能由哪些前体做出来\"，树搜索在可能的拆解路径里找代价最低的合成路线。",
  "mechanism": "单步逆合成用模板匹配或 Transformer 直接从前体生成产物（正向反应预测的反用）；多步搜索用蒙特卡洛树搜索或 A* 变体（Retro* 的 And-Or 树搜索是代表），价值函数估计\"这条路线还剩几步、多贵\"。评估维度包括步骤数、原料可得性、反应成功率先验。",
  "why": "逆合成的组合爆炸靠人脑枚举不现实，2018 年 Segler 在 Nature 上证明深度学习+树搜索能做出接近专业化学家的路线规划，是这个范式的起点。如今它是分子生成管线的标准下游筛子——生成模型出的每个分子都要先过\"做不做得出来\"这一关。",
  "co": "ASKCOS（MIT，开源）、AiZynthFinder（阿斯利康，开源）、Synthia（默克旗下，商业）；各家生成平台（Chemistry42 等）内部均集成同类模块。",
  "lim": "预测的路线跟实际产率、纯化难度、副反应经常对不上——模型学的是文献里\"报道过的反应\"，文献不报失败实验，数据天生带幸存者偏差。它的现实定位是\"快速排除明显做不出来的分子\"，不是合成保证书。",
  "papers": [
   "Segler et al., \"Planning chemical syntheses with deep neural networks and symbolic AI\", Nature 2018",
   "Chen et al., \"Retro*: Learning Retrosynthetic Planning with Neural Guided A* Search\", NeurIPS 2020",
   "Genheden et al., \"AiZynthFinder: a fast, robust and flexible open-source software for retrosynthetic planning\", J. Cheminform. 2020"
  ]
 },
 "n30": {
  "principle": "把活性、选择性、ADMET、可合成性打成多目标打分函数，生成式设计往这个组合目标收敛，用最少合成次数逼近临床候选。",
  "mechanism": "主动学习闭环（节点 29 同源）+ 多目标优化的组合：每轮设计少量分子、合成、测试、回灌模型。其行业地位来自纪录而非架构：DSP-1181（强迫症，与住友合作）2020 年进 I 期，是史上首个进入人体的 AI 设计分子，当时宣称从启动到临床仅 12 个月。",

  "co": "Recursion（RXRX，合并后实体；原 Exscientia 管线与合作并入）。",
  "lim": "但这也是投研里最该研究的\"反例\"集：DSP-1181 后来被住友终止，EXS21546 因治疗窗问题 2023 年下马，BMS 2025 年 10 月砍掉合作中的 PKC-θ 抑制剂。史上第一个进临床的 AI 分子没能走到证明疗效那步——\"进临床\"和\"能成药\"之间的鸿沟，这家公司一个也没能跨过去。看任何\"我们分子进临床了\"的宣传都该想起这组名字。",
  "papers": [

 },
 "n31": {
  "principle": "逆折叠：给定蛋白骨架结构，反推什么样的氨基酸序列能折成这个骨架——\"结构→序列\"的标准件。",
  "mechanism": "图神经网络编码骨架几何（残基间距离、方向、相对位置），消息传递后用自回归方式逐个位置解码氨基酸。关键工程细节是引入解码顺序随机化和噪声训练，对 backbone 误差鲁棒。推理速度极快（秒级出几十条候选序列）。",
  "why": "蛋白设计的流水线是\"先生成骨架、再填序列\"，ProteinMPNN 填序列这一步的成功率（设计序列能正确折叠的比例）比此前方法高出一个量级，直接让整条设计管线从\"大量试错\"变成\"少量精筛\"。几乎所有蛋白设计公司（Generate、Absci、Xaira）的流水线里都有它或它的变体（BoltzGen 的逆折叠模块就是 SolubleMPNN 的改版）。",
  "co": "Baker Lab（华盛顿大学）开源，Rosetta/RFdiffusion 生态标配。",
  "lim": "它只对骨架负责：骨架本身能不能生成、生成得好不好，是上游模型的事；序列折得对也不等于有功能——结合亲和力、催化活性、免疫原性都是下游还要过的关。",
  "papers": [
   "Dauparas et al., \"Robust deep learning–based protein sequence design using ProteinMPNN\", Science 2022"
  ]
 },
 "n32": {
  "principle": "把扩散模型搬到蛋白骨架空间：从随机噪声出发，以 RoseTTAFold 的结构知识为引导，逐步去噪\"长\"出全新蛋白骨架。",
  "mechanism": "在残基刚体（旋转+平移）空间定义扩散（F3 的 SE(3) 版本），去噪网络用预训练的 RoseTTAFold 微调而来（F4）。支持多种条件化：给功能位点支架化（motif scaffolding）、给对称性约束、给靶点界面约束做结合子设计。生成骨架后接 ProteinMPNN 填序列、再用 AF2 回测\"序列是否折回设计的骨架\"，三段筛子串成完整管线。",
  "why": "此前从头设计蛋白骨架靠物理采样（Rosetta），成功率低到需要筛选几十万设计。RFdiffusion 把命中率拉高了一到两个数量级，让\"按需求定制蛋白\"从偶发成功变成常规操作。2025 年 11 月 Nature 发表的原子级精度从头抗体设计（不依赖任何天然抗体框架）建立在这条线上。",
  "co": "Baker Lab 开源；是 Generate Biomedicines、Xaira 等公司的技术底座之一，学术引用与二次开发极多。",
  "lim": "骨架画得好，不等于序列折得对，更不等于有功能：中间要过 ProteinMPNN 和 AF2 好几道筛，最终湿实验命中率通常还是个位数百分比——只是分母从\"几十万\"缩到\"几十\"，这已经是革命，但不是\"设计即所得\"。",
  "papers": [
   "Watson et al., \"De novo design of protein structure and function with RFdiffusion\", Nature 2023",

 "n33": {

function route(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [head, tail] = raw.split('/');
  let view = 'graph', node = null;
  if (head === 'timeline' || head === 'companies' || head === 'papers') view = head;
  const idRaw = (view === 'graph' ? head : tail) || '';
  const m = idRaw.match(/^node-(\d+)$/) || idRaw.match(/^n(\d+)$/);
  if (m){ const nd = byId('n' + m[1]); if (nd){ node = nd._id; if (view !== 'timeline') view = 'graph'; } }
  return {view, node};
}

  silent = true;
  history.replaceState(null, '', h);
  silent = false;
}

/* ---------- 链路计算与高亮 ---------- */
function walk(startId, adj){
  const seen = new Set(), stack = (adj[startId] || []).slice();
  while (stack.length){
    const id = stack.pop();
    if (seen.has(id) || id === startId) continue;
    seen.add(id);
    (adj[id] || []).forEach(nx => { if (!seen.has(nx)) stack.push(nx); });
  }
  return seen;
}

function buildFocus(id){
  const up = walk(id, IN), down = walk(id, OUT);
  const set = new Set([id, ...up, ...down]);
  return {id, up, down, up1: IN[id] || [], down1: OUT[id] || [], set};
}

function markClass(id){
  if (!state.focus) return '';
  if (id === state.focus.id) return ' sel';
  if (state.focus.up.has(id)) return ' up';
  if (state.focus.down.has(id)) return ' down';
  return ' dim';
}

function paintChain(){
  const f = state.focus;
  const nodes = document.querySelectorAll('#main .node, #main .tl-node');
  nodes.forEach(el => {
    el.classList.remove('dim','up','down','sel');
    const tag = el.querySelector('.flowtag');
    if (tag) tag.remove();
    const cls = markClass(el.dataset.id).trim();
    if (cls) el.classList.add(cls);
    if (f && f.set.has(el.dataset.id) && el.dataset.id !== f.id){
      const t = document.createElement('span');
      const isUp = f.up.has(el.dataset.id);
      t.className = 'flowtag ' + (isUp ? 'up' : 'down');
      t.textContent = isUp ? '上游' : '下游';
      el.appendChild(t);
    }
  });
  document.querySelectorAll('#main .lane').forEach(lane => {
    const any = lane.querySelector('.node:not(.dim)');
    lane.classList.toggle('faded', !!(f && !any));
  });
  renderChainBar();
  drawWires();
}

function renderChainBar(){
  const f = state.focus;
  chainbar.classList.toggle('on', !!f);
  if (!f) { chainbar.innerHTML = ''; return; }
  const cur = byId(f.id);
  const ups = f.up1.map(byId).filter(Boolean);
  const downs = f.down1.map(byId).filter(Boolean);
  const chip = (nd, cls) => '<button class="chip ' + cls + '" data-go="' + nd._id + '" title="' + esc(nd.n) + '">' + esc(nd.n) + '</button>';
  const lbl = (t, d, n) => '<span class="chain-lbl" title="' + (d ? '直接相连 ' + d + ' 个，整条链路共 ' + n + ' 个' : '') + '">' + t + (d < n ? ' ' + d + ' / 全链 ' + n : ' ' + n) + '</span>';
  let h = '';
  h += lbl('上游输入', ups.length, f.up.size);
  h += '<span class="chain-seg">' + (ups.length ? ups.map(n => chip(n,'up')).join('<span class="arrow">→</span>') : '<span class="arrow">（无）</span>') + '</span>';
  h += '<span class="arrow">→</span>' + chip(cur, 'cur');
  h += '<span class="arrow">→</span>' + lbl('下游应用', downs.length, f.down.size);
  h += '<span class="chain-seg">' + (downs.length ? downs.map(n => chip(n,'down')).join('<span class="arrow">→</span>') : '<span class="arrow">（无）</span>') + '</span>';
  h += '<button id="clearchain">清除高亮</button>';
  chainbar.innerHTML = h;
  chainbar.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => openNode(b.dataset.go)));
  chainbar.querySelector('#clearchain').addEventListener('click', () => {
    state.focus = null; state.node = null;
    paintChain(); closeDrawer(); pushHash();
  });
}

function drawWires(){
  const svg = document.getElementById('wires');
  const lanes = document.getElementById('lanes');
  if (!svg || !lanes) return;
  svg.innerHTML = '';
  const f = state.focus;
  if (!f) return;
  const w = lanes.scrollWidth, hgt = lanes.scrollHeight, box = lanes.getBoundingClientRect();
  svg.setAttribute('width', w); svg.setAttribute('height', hgt);
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
  svg.innerHTML = '<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">' +
                  '<path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker></defs>';
  PAIRS.forEach(([a, b]) => {
    if (!f.set.has(a) || !f.set.has(b)) return;
    const ea = document.querySelector('.node[data-id="' + a + '"]');
    const eb = document.querySelector('.node[data-id="' + b + '"]');
    if (!ea || !eb) return;
    const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
    const ax = ra.left - box.left, ay = ra.top - box.top, bx = rb.left - box.left, by = rb.top - box.top;
    const down = by >= ay;
    const x1 = ax + ra.width / 2, y1 = down ? ay + ra.height : ay;
    const x2 = bx + rb.width / 2, y2 = down ? by : by + rb.height;
    const dy = Math.max(18, Math.abs(y2 - y1) * 0.42) * (down ? 1 : -1);
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', a === f.id ? '#16a34a' : (b === f.id ? '#d97706' : '#94a3b8'));
    p.setAttribute('stroke-width', '1.4');
    p.setAttribute('stroke-dasharray', '4 3');
    p.setAttribute('opacity', '0.65');
    p.setAttribute('marker-end', 'url(#ah)');
    svg.appendChild(p);
  });
  const note = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  note.setAttribute('x', '4'); note.setAttribute('y', hgt - 6);
  note.setAttribute('fill', '#b6c0cd'); note.setAttribute('font-size', '11');
  note.textContent = '橙色 = 上游输入 · 绿色 = 下游应用';
  svg.appendChild(note);
}

/* ---------- 抽屉 ---------- */
function openNode(id, fromRoute){
  const nd = byId(id);
  if (!nd) return;
  state.node = id;
  state.focus = buildFocus(id);
  document.getElementById('dTitle').textContent = nd.n;
  document.getElementById('dSub').textContent = (nd.s ? nd.s + ' · ' : '') + nd._stage + ' · ' + nd._group +
    (nd._y ? ' · ' + nd._y + ' 年' : '');
  const mt = MAT[nd.m];
  let h = '<span class="badge ' + mt.c + '">' + mt.label + '</span>';
  if (nd.mn) h += '<div class="field"><h4>成熟度说明</h4><p>' + nd.mn + '</p></div>';
  const dd = (typeof DETAILS !== 'undefined' && DETAILS[nd._id]) || nd.d || {};
  if (dd.principle) h += '<div class="field"><h4>原理概括</h4><p>' + esc(dd.principle) + '</p></div>';
  if (dd.mechanism) h += '<div class="field"><h4>核心机制</h4>' + texmech(dd.mechanism) + '</div>';
  else h += '<div class="field"><h4>用途</h4><p>' + nd.u + '</p></div>';
  if (dd.why) h += '<div class="field"><h4>为什么有效</h4><p>' + esc(dd.why) + '</p></div>';
  const coTxt = dd.co || nd.co;
  if (coTxt) h += '<div class="field"><h4>' + (dd.co ? '代表工具与公司' : '代表公司') + '</h4><p>' + esc(coTxt) + '</p></div>';
  const limTxt = dd.lim || nd.lim;
  if (limTxt) h += '<div class="field"><h4>局限</h4><p>' + esc(limTxt) + '</p></div>';
  if (dd.papers && dd.papers.length){
    let ph = '';
    dd.papers.forEach(p => { ph += '<p style="margin-bottom:4px">· ' + p + '</p>'; });
    h += '<div class="field"><h4>关键论文</h4>' + ph + '</div>';
  }
  if (nd.tip) h += '<div class="field"><h4>投研提示</h4><p>' + nd.tip + '</p></div>';
  if (nd.f && nd.f.length){
    nd.f.forEach(fid => {
      const fo = FORMULAS[fid];
      h += '<div class="field formula"><h4>' + fid + ' · ' + fo.t + '</h4><div class="kt" data-tex="' + fo.tex.replace(/"/g,'&quot;') + '"></div></div>';
    });
  }
  const hash = state.view === 'graph' ? '#node-' + id.slice(1) : '#' + state.view + '/node-' + id.slice(1);
  h += '<div class="field"><h4>分享定位</h4><div class="sharebox"><code>' + esc(hash) + '</code>' +
       '<button id="copylink">复制链接</button></div></div>';
  document.getElementById('dBody').innerHTML = h;
  document.getElementById('dBody').querySelector('#copylink').addEventListener('click', async (e) => {
    const url = location.origin + location.pathname + hash;
    try { await navigator.clipboard.writeText(url); e.target.textContent = '已复制'; }
    catch(_){ location.hash = hash; e.target.textContent = '已写入地址栏'; }
    setTimeout(() => { e.target.textContent = '复制链接'; }, 1600);
  });
  drawer.classList.add('open');
  renderMath(document.getElementById('dBody'));
  paintChain();
  if (!fromRoute) pushHash();
  const sel = document.querySelector('.node[data-id="' + id + '"], .tl-node[data-id="' + id + '"]');
  if (sel) sel.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
}

function closeDrawer(){
  drawer.classList.remove('open');
  state.node = null;
  state.focus = null;
  paintChain();
}

/* 机制文本渲染：$$…$$ 块级公式、$…$ 行内公式，其余转义为纯文本 */
function texmech(s){
  let t = esc(s);
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => '</p><div class="kt" data-tex="' + tex.replace(/"/g,'&quot;') + '"></div><p>');
  t = t.replace(/\$([^$\n]+?)\$/g, (m, tex) => '<span class="kti" data-tex="' + tex.replace(/"/g,'&quot;') + '"></span>');
  return '<p>' + t + '</p>';
}

function renderMath(root){
  if (typeof katex === 'undefined'){ setTimeout(() => renderMath(root), 200); return; }
  root.querySelectorAll('.kt').forEach(el => {
    try { katex.render(el.dataset.tex, el, {displayMode:true, throwOnError:false}); } catch(e){ el.textContent = el.dataset.tex; }
  });
  root.querySelectorAll('.kti').forEach(el => {
    try { katex.render(el.dataset.tex, el, {displayMode:false, throwOnError:false}); } catch(e){ el.textContent = el.dataset.tex; }
  });
}

function renderPapers(){

/* ---------- 时间轴 ---------- */
const Y0 = 2012, Y1 = 2026, NCOL = Y1 - Y0 + 1;

function pack(arr, keyFn){
  const counts = {}, rowOf = new Map();
  arr.map(keyFn).forEach(k => { counts[k] = 0; });
  arr.forEach(nd => {
    const k = keyFn(nd);
    rowOf.set(nd._id, counts[k]++);
  });
  const rows = Math.max(1, ...Object.values(counts));
  return {rows, rowOf};
}
const colOf = y => Math.min(NCOL, Math.max(1, y - Y0 + 1));

function renderTimeline(){
  const years = Array.from({length: NCOL}, (_, i) => Y0 + i);
  const fit = state.fit !== false;
  let h = '<div id="timeline"' + (fit ? ' class="fit"' : '') + '>';
  h += '<div class="tl-tools"><span class="chain-lbl">2012 – 2026 · 4 个技术时代 · 11 个拐点</span>' +
       '<button id="tlzoom">' + (fit ? '放大看细节' : '缩到一屏') + '</button></div>';

  h += '<div class="tl-sticky"><div class="tl-grid">' +
       years.map(y => '<div class="tl-year">' + y + '</div>').join('') + '</div></div>';

  h += '<div class="tl-grid" style="margin-bottom:6px">' +
       ERAS.map(e => '<div class="era ' + e.cls + '" style="grid-column:' + colOf(e.from) + ' / span ' + (colOf(e.to) - colOf(e.from) + 1) + '" title="' + esc(e.s) + '">' +
                      esc(e.t) + '<small>' + e.from + '–' + e.to + '</small></div>').join('') + '</div>';

  const ms = MILESTONES.slice().sort((a, b) => a.y - b.y);
  const msPack = pack(ms, m => m.y);
  h += '<div class="msrow"><div class="chain-lbl" style="margin-bottom:8px">演进脉络</div>' +
       '<div class="tl-grid">' +
       ms.map(m => '<div class="ms" style="grid-column:' + colOf(m.y) + ';grid-row:' + (msPack.rowOf.get(m.y) + 1) + '">' +
                   '<b>' + m.y + ' · ' + esc(m.t) + '</b>' + esc(m.d) + '</div>').join('') +
       '</div></div>';

  STAGES.forEach(st => {
    const list = [];
    st.groups.forEach(gp => gp.nodes.forEach(nd => list.push(nd)));
    list.sort((a, b) => (a._y || 0) - (b._y || 0) || a.n.localeCompare(b.n));
    const pk = pack(list, nd => nd._y || 0);
    h += '<div class="band' + (st.hot ? ' hot' : '') + '">' +
         '<div class="band-head"><span class="bn">' + st.name + '</span><span class="be">' + st.en + ' · ' + list.length + ' 个节点</span></div>' +
         '<div class="tl-grid">' +
         list.map(nd => '<div class="tl-node" data-id="' + nd._id + '" style="grid-column:' + colOf(nd._y || Y0) + ';grid-row:' + (pk.rowOf.get(nd._id) + 1) + '" title="' + esc(nd.n) + (nd._y ? '（' + nd._y + '）' : '') + '">' +
                        '<i class="dot ' + MAT[nd.m].c + '"></i><span class="tn">' + nd.n + '</span></div>').join('') +
         '</div></div>';
  });

  h += '<div class="tl-note">按技术首次出现 / 代表作发表的年份定位；同一节点跨多年时取最早一年。点击节点可看详情与上下游链路。</div>';
  h += '</div>';
  main.innerHTML = h;
  main.querySelectorAll('.tl-node').forEach(el => el.addEventListener('click', () => openNode(el.dataset.id)));
  main.querySelector('#tlzoom').addEventListener('click', () => {
    state.fit = !(state.fit !== false);
    const left = document.getElementById('main').scrollLeft;
    renderTimeline();
    if (!state.fit) document.getElementById('main').scrollLeft = left;
  });
  if (state.focus) paintChain();
}

  }

});

document.addEventListener('keydown', e => {

});
window.addEventListener('resize', () => { if (state.focus) drawWires(); });
window.addEventListener('hashchange', () => { if (!silent) applyRoute(); });

applyRoute();
