name: 每日 AIDD 论文

on:
  schedule:
    - cron: '47 23 * * *'   # 北京时间每天 07:47
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf
      - name: 抓取并翻译论文
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/fetch_papers.py
      - name: 提交 papers.json
        run: |
          git config user.name "aidd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add papers.json
          git diff --cached --quiet || git commit -m "papers: $(date -u +%Y-%m-%d)"
          git push
